name: builder

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.0.0)"
        required: true

# ── Tag conventions ───────────────────────────────────────────────────────────
#   v{version}             → builds spf (library)

jobs:
  parse-tag:
    name: Parse Tag
    runs-on: ubuntu-latest
    outputs:
      type:        ${{ steps.parse.outputs.type }}
      version:     ${{ steps.parse.outputs.version }}
      sha:         ${{ steps.parse.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag → component metadata
        id: parse
        run: |
          TAG="${{ inputs.tag_name }}"
          SHA=$(git rev-list -n 1 "$TAG")
          echo "sha=$SHA" >> $GITHUB_OUTPUT

          # v1.0.0  →  version=1.0.0
          VERSION=$(echo "$TAG" | awk -F'-v' '{print $2}')

          echo "type=library"         >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  header-file:
    name: Generate ABI Header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Generate header
        run: |
          cbindgen --output spf.h --lang c --cpp-compat
      
      # Fix: Upload the generated header so subsequent jobs can access it
      - name: Upload ABI Header
        uses: actions/upload-artifact@v4
        with:
          name: spf-header
          path: spf.h

  # ── Cross-compile matrix ──────────────────────────────────────────────────────
  # macOS targets run on macos-latest: aws-lc-sys requires the real Apple SDK
  # (CoreServices.h and friends) which zigbuild's bundled SDK doesn't ship.
  # All other targets run on ubuntu-latest and cross-compile via cargo-zigbuild.
  build:
    name: Build ${{ needs.parse-tag.outputs.component }} (${{ matrix.target }})
    needs: [parse-tag, header-file]
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (cross-compiled from ubuntu via zigbuild) ──────────────────
          - { target: x86_64-unknown-linux-gnu,      os: ubuntu-latest }
          # - { target: x86_64-unknown-linux-musl,     os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,     os: ubuntu-latest }
          # - { target: aarch64-unknown-linux-musl,    os: ubuntu-latest }
          - { target: i686-unknown-linux-gnu,        os: ubuntu-latest }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest }
          # ── Windows (cross-compiled from ubuntu via zigbuild) ────────────────
          - { target: x86_64-pc-windows-gnu,         os: ubuntu-latest }
          # ── FreeBSD (cross-compiled from ubuntu via zigbuild) ────────────────
          - { target: x86_64-unknown-freebsd,        os: ubuntu-latest }
          # ── macOS (native runners — aws-lc-sys needs the real Apple SDK) ─────
          - { target: x86_64-apple-darwin,           os: macos-latest  }
          - { target: aarch64-apple-darwin,          os: macos-latest  }
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME:  ${{ inputs.tag_name }}
      TARGET:    ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4
        # with:
        #   ref: ${{ needs.parse-tag.outputs.sha }}
      
      # Fix: Download the header artifact from the `header-file` job
      - name: Download ABI Header
        uses: actions/download-artifact@v4
        with:
          name: spf-header

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zigbuild only needed on Linux runners
      - name: Install Zig + cargo-zigbuild
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install ziglang --quiet
          cargo install cargo-zigbuild --locked

      - name: Build
        run: bash .ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: artifacts/*.tar.gz

  # ── Collect and publish ───────────────────────────────────────────────────────
  release:
    name: Upload Release Assets
    needs: [parse-tag, build]
    outputs:
      outcome: ${{ steps.upload.outcome }}
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: artifacts/

      - name: List collected artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v1
        id: upload
        with:
          tag_name: ${{ inputs.tag_name }}
          files: artifacts/*


  badge:
    runs-on: ubuntu-latest
    needs: release
    if: always()

    steps:
      - name: passing
        if: needs.release.outputs.outcome == 'success'
        uses: SimplePixelFont/badge-spf-action@main
        with:
          filename: compatibility.png
          label: Compatibility
          message: passing
          labelColor: "#2d3136"
          color: "#00bfa3"
          logo: "https://raw.githubusercontent.com/The-Nice-One/GalleryArt/refs/heads/main/emojis_flattened/version_control.png"
          font: "https://raw.githubusercontent.com/SimplePixelFont/web-spf/refs/heads/main/Monogram5x8-light.spf"

      - name: failing
        if: needs.release.outputs.outcome == 'failure' || needs.release.outputs.outcome == 'cancelled' || needs.release.outputs.outcome == 'skipped'
        uses: SimplePixelFont/badge-spf-action@main
        with:
          filename: compatibility.png
          label: Compatibility
          message: failing
          labelColor: "#2d3136"
          color: "#d94a69"
          logo: "https://raw.githubusercontent.com/The-Nice-One/GalleryArt/refs/heads/main/emojis_flattened/version_control.png"
          font: "https://raw.githubusercontent.com/SimplePixelFont/web-spf/refs/heads/main/Monogram5x8-light.spf"

      - name: deploy
        uses: exuanbo/actions-deploy-gist@v1
        with:
          token: ${{ secrets.GIST_SECRET }}
          gist_id: cfebb0fe555ac7e77ada109c469cdeb4
          file_path: compatibility.png
          file_type: binary